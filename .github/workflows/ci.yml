name: CI

# Qualidade e testes. Roda em todo Pull Request e também pode ser chamado por outro
# workflow (workflow_call), como o deploy planejado na PED-119.
on:
  pull_request:
    branches: [main, prod]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualidade:
    name: Qualidade
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos e lint (npm run check)
        run: npm run check

      - name: Compilar (npm run build)
        run: npm run build

  testes:
    name: Testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pedmesa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pedmesa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3001
      CORS_ORIGIN: http://localhost:5173
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: pedmesa_test
      JWT_SECRET: segredo-somente-para-ci
      JWT_EXPIRES_IN: 1h
      SUPER_ADMIN_JWT_SECRET: outro-segredo-somente-para-ci
      PRINT_FAILURE_RATE: 0
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar os testes unitários e de integração (npm test)
        # As migrations e o seed rodam no setup global da suíte de integração
        run: npm test

  commits:
    name: Commits
    # O Dependabot gera mensagens fora do padrão do projeto
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código com o histórico
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar as mensagens de commit do PR (commitlint)
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
