name: Deploy

# Entrega contínua (PED-119): roda o CI, publica a imagem no GHCR, pede o deploy
# ao Coolify e espera ele terminar. A última etapa confere se a versão nova está
# mesmo no ar e, depois, roda a verificação de segurança (PED-120).
# main = homologação, prod = produção. Configuração manual em docs/CICD.md.
on:
  push:
    branches: [main, prod]
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente de destino
        type: choice
        options: [homologacao, producao]
        default: homologacao

permissions:
  contents: read

jobs:
  ambiente:
    name: Ambiente
    runs-on: ubuntu-latest
    outputs:
      nome: ${{ steps.definir.outputs.nome }}
    steps:
      - name: Definir o ambiente pela branch
        id: definir
        env:
          ENTRADA: ${{ inputs.ambiente }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$ENTRADA" ]; then nome="$ENTRADA"
          elif [ "$BRANCH" = "prod" ]; then nome="producao"
          else nome="homologacao"; fi
          echo "nome=$nome" >> "$GITHUB_OUTPUT"
          echo "Ambiente de destino: $nome"

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  entregar:
    name: Entregar
    needs: [ambiente, ci]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.ambiente.outputs.nome }}
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-${{ needs.ambiente.outputs.nome }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      url: ${{ vars.APP_URL }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar o Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir o nome da imagem (o GHCR exige minúsculas)
        id: imagem
        run: echo "nome=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Construir e publicar a imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.imagem.outputs.nome }}:${{ needs.ambiente.outputs.nome }}
            ${{ steps.imagem.outputs.nome }}:sha-${{ github.sha }}
            ${{ needs.ambiente.outputs.nome == 'producao' && format('{0}:latest', steps.imagem.outputs.nome) || '' }}
          # O commit vai para dentro da imagem: a verificação final compara com ele
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pedir o deploy ao Coolify
        id: deploy
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: bash scripts/coolify-deploy.sh disparar

      - name: Esperar o Coolify terminar o deploy
        if: steps.deploy.outputs.uuid != ''
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: bash scripts/coolify-deploy.sh aguardar "${{ steps.deploy.outputs.uuid }}"

  verificar:
    name: Verificar no ar
    needs: [ambiente, entregar]
    # Roda mesmo se a entrega falhar: mostra o que está no ar de fato
    if: ${{ !cancelled() && needs.entregar.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Conferir se a versão nova está no ar
        env:
          APP_URL: ${{ needs.entregar.outputs.url }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning title=Verificação ignorada::APP_URL não configurada no environment ${{ needs.ambiente.outputs.nome }}."
            exit 0
          fi
          bash scripts/verificar-no-ar.sh "$APP_URL" api "${{ github.sha }}"

  seguranca:
    name: Segurança
    needs: [entregar, verificar]
    if: needs.verificar.result == 'success' && needs.entregar.outputs.url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Verificar cabeçalhos de segurança (PED-120)
        env:
          # report: só lista; enforce: falha o pipeline. Mudar para enforce
          # depois da PED-59, PED-64 e PED-69 (variável de repositório CHECK_MODE).
          CHECK_MODE: ${{ vars.CHECK_MODE || 'report' }}
        run: bash scripts/check-security-headers.sh "${{ needs.entregar.outputs.url }}" api
