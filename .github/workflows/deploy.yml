name: Deploy

# Entrega contínua (PED-119): roda o CI, publica a imagem no GHCR, pede o deploy
# ao Coolify, espera o deploy terminar, confere o /ready e roda a verificação de
# segurança (PED-120). main = homologação, prod = produção. Detalhes e a
# configuração manual (Coolify e GitHub Environments) em docs/CICD.md.
on:
  push:
    branches: [main, prod]
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente de destino
        type: choice
        options: [homologacao, producao]
        default: homologacao

permissions:
  contents: read

jobs:
  ambiente:
    name: Ambiente
    runs-on: ubuntu-latest
    outputs:
      nome: ${{ steps.definir.outputs.nome }}
    steps:
      - name: Definir o ambiente pela branch
        id: definir
        env:
          ENTRADA: ${{ inputs.ambiente }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$ENTRADA" ]; then nome="$ENTRADA"
          elif [ "$BRANCH" = "prod" ]; then nome="producao"
          else nome="homologacao"; fi
          echo "nome=$nome" >> "$GITHUB_OUTPUT"
          echo "Ambiente de destino: $nome"

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  entregar:
    name: Entregar
    needs: [ambiente, ci]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.ambiente.outputs.nome }}
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-${{ needs.ambiente.outputs.nome }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      url: ${{ vars.APP_URL }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar o Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir o nome da imagem (o GHCR exige minúsculas)
        id: imagem
        run: echo "nome=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Construir e publicar a imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.imagem.outputs.nome }}:${{ needs.ambiente.outputs.nome }}
            ${{ steps.imagem.outputs.nome }}:sha-${{ github.sha }}
            ${{ needs.ambiente.outputs.nome == 'producao' && format('{0}:latest', steps.imagem.outputs.nome) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pedir o deploy ao Coolify
        id: deploy
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_APP_UUID" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::warning::COOLIFY_URL, COOLIFY_APP_UUID ou COOLIFY_TOKEN não configurados neste ambiente: a imagem foi publicada, mas nada foi implantado."
            exit 0
          fi
          resposta="$(curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false")"
          echo "Resposta do Coolify: $resposta"
          deployment="$(printf '%s' "$resposta" | jq -r '.deployments[0].deployment_uuid // empty')"
          if [ -z "$deployment" ]; then
            echo "::error::O Coolify não devolveu o identificador do deploy."
            exit 1
          fi
          echo "uuid=$deployment" >> "$GITHUB_OUTPUT"

      - name: Esperar o Coolify terminar o deploy
        if: steps.deploy.outputs.uuid != ''
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DEPLOYMENT: ${{ steps.deploy.outputs.uuid }}
        run: |
          for tentativa in $(seq 1 60); do
            status="$(curl --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "${COOLIFY_URL%/}/api/v1/deployments/${DEPLOYMENT}" | jq -r '.status // "desconhecido"')"
            echo "Tentativa $tentativa: $status"
            case "$status" in
              finished) echo "Deploy concluído."; exit 0 ;;
              failed|cancelled*|error) echo "::error::O deploy terminou com status '$status'. Veja os logs no Coolify."; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::O deploy não terminou em 10 minutos."
          exit 1

      - name: Conferir se a API responde em /ready
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning::APP_URL não configurada neste ambiente: verificação ignorada."
            exit 0
          fi
          url="${APP_URL%/}/ready"
          for tentativa in $(seq 1 10); do
            if curl --fail --silent --show-error --max-time 15 "$url"; then
              echo
              echo "API pronta em $url (tentativa $tentativa)."
              exit 0
            fi
            echo "Tentativa $tentativa de 10 falhou; nova tentativa em 15 s."
            sleep 15
          done
          echo "::error::A API não respondeu em $url depois do deploy."
          exit 1

  seguranca:
    name: Segurança
    needs: entregar
    if: needs.entregar.outputs.url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Verificar cabeçalhos de segurança (PED-120)
        env:
          # report: só lista; enforce: falha o pipeline. Mudar para enforce
          # depois da PED-59, PED-64 e PED-69 (variável de repositório CHECK_MODE).
          CHECK_MODE: ${{ vars.CHECK_MODE || 'report' }}
        run: bash scripts/check-security-headers.sh "${{ needs.entregar.outputs.url }}" api
